        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@400;600&display=swap');
        :root { --bg: #000000; --accent: #d4af37; --glow: rgba(212, 175, 55, 0.4); --glass: rgba(255, 255, 255, 0.05); }
        body { background-color: var(--bg); color: #ffffff; font-family: 'Inter', sans-serif; margin: 0; padding: 15px; min-height: 100vh; background-image: radial-gradient(circle at 15% 25%, var(--glow) 0%, transparent 35%), radial-gradient(circle at 85% 75%, var(--glow) 0%, transparent 35%); background-attachment: fixed; }
        .color-controls { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
        .theme-btn { background: var(--glass); backdrop-filter: blur(5px); color: white; border: 1px solid var(--accent); padding: 8px 15px; border-radius: 5px; font-family: 'Orbitron'; font-size: 0.7em; cursor: pointer; transition: 0.3s; box-shadow: 0 0 10px var(--glow); text-transform: uppercase; }
        .picker-wrapper { width: 34px; height: 34px; border-radius: 50%; border: 2px solid #fff; position: relative; cursor: pointer; box-shadow: 0 0 15px var(--accent); background-color: var(--accent); flex-shrink: 0; }
        #freePicker { position: absolute; opacity: 0; width: 100%; height: 100%; cursor: pointer; top:0; left:0; z-index: 10; }
        .orbiteur-nav { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
        .nav-btn { background: var(--accent); color: #000; border: none; padding: 12px; border-radius: 5px; font-family: 'Orbitron'; font-size: 0.65em; font-weight: bold; cursor: pointer; text-transform: uppercase; box-shadow: 0 4px 15px var(--glow); }
        .section-title { font-family: 'Orbitron'; color: var(--accent); font-size: 0.8em; letter-spacing: 2px; margin: 20px 0 10px 5px; text-transform: uppercase; }
.card { 
    background: rgba(0, 0, 0, 0.5); /* Plus sombre pour faire ressortir le flou */
    backdrop-filter: blur(15px) saturate(160%); /* Flou plus fort style Orbiteur */
    -webkit-backdrop-filter: blur(15px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, 0.1); 
    border-radius: 12px; 
    padding: 18px; 
    margin-bottom: 15px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
}

/* On ajoute du style aux titres traduits à l'intérieur */
.card h3 {
    margin: 0 0 10px 0;
    color: var(--accent); /* Ta couleur (Or, Bleu, etc.) */
    font-weight: 900;
    text-transform: uppercase;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
    font-size: 1.1rem;
}

/* Style pour les noms d'items traduits */
.item-row span {
    font-weight: 700;
    text-transform: uppercase;
    font-size: 0.9rem;
}
        .row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .timer { font-family: 'Orbitron'; color: var(--accent); font-weight: bold; font-size: 0.85em; white-space: nowrap; }
        .status { font-size: 0.8em; font-weight: bold; text-transform: uppercase; font-family: 'Orbitron'; }
        .steel { color: #ff3333 !important; text-shadow: 0 0 10px rgba(255,0,0,0.6); }
        .node-info { font-size: 0.75em; color: rgba(255,255,255,0.5); width: 100%; margin-top: 4px; }

        .sub-btn.active { background: var(--accent); color: #000; }
        .inv-meta { display: flex; justify-content: space-between; font-size: 0.65em; margin-top: 8px; font-family: 'Orbitron'; color: var(--accent); }
        .prog-bar { width: 100%; height: 6px; background: rgba(255,255,255,0.1); margin-top: 4px; border-radius: 3px; overflow: hidden; }
        .prog-fill { height: 100%; background: var(--accent); box-shadow: 0 0 8px var(--accent); transition: 0.5s; }
   
   
/* Conteneur principal style Fenêtre Windows 95 */

/* Style de base des boutons (Mode Lune par défaut) */
.nav-btn { 
    background: rgba(0, 0, 0, 0.6) !important; /* Fond noir transparent */
    color: var(--accent) !important; /* Texte en couleur (jaune, bleu, etc.) */
    border: 1px solid var(--accent) !important; /* Bordure fine */
    padding: 12px; 
    border-radius: 5px; 
    font-family: 'Orbitron'; 
    font-size: 0.65em; 
    font-weight: bold; 
    cursor: pointer; 
    text-transform: uppercase; 
    box-shadow: 0 0 5px var(--glow); 
    transition: 0.3s;
}

/* Effet quand on passe la souris ou clic */
.nav-btn:active {
    background: var(--accent) !important;
    color: #000 !important;
}
/* Mode Soleil : On remonte la luminosité du thème */
[data-theme="light"] body {
    background: radial-gradient(circle at 50% 40%, rgba(212, 175, 55, 0.4) 0%, #1a1a1a 100%) no-repeat fixed;
    background-color: #1a1a1a;
}

/* Les cartes : plus transparentes en mode nuit pour voir le fond */
.card {
    background: rgba(0, 0, 0, 0.6) !important;
    backdrop-filter: blur(8px);
    border: 1px solid rgba(212, 175, 55, 0.1);
    transition: 0.5s;
}

[data-theme="light"] .card {
    background: rgba(20, 20, 20, 0.8) !important;
    border: 1px solid var(--accent);
}
   
   
   /* Par défaut, tout est normal */
html {
    transition: filter 0.5s ease; /* Transition douce pour les yeux */
}

/* Quand on active la lune, on assombrit TOUT le site d'un coup */
/* Ton orange Grineer restera orange, mais un orange très sombre */
[data-theme="dark-mode"] {
    filter: brightness(0.6) contrast(1.1);
}

/* On empêche le bouton et le sélecteur d'être assombris pour qu'ils restent visibles */
#dayNightBtn, .picker-container {
    filter: brightness(1.5);
}

   
   
   /* Par défaut, on ne change rien */
html {
    transition: filter 0.5s ease-in-out;
}

/* Quand la lune est active, on baisse la luminosité et on augmente un peu le contraste pour que ce soit "plus joli" */
[data-theme="dark"] {
    filter: brightness(0.7) contrast(1.1);
}

/* On s'assure que le bouton lune/soleil et le picker de couleur ne soient pas affectés par le filtre pour qu'ils restent clairs */
#dayNightBtn, .picker-container {
    filter: brightness(1.2);
}

    <div id="content">
        <div class="section-title" id="view-title">CYCLES</div>
        <div class="card" id="main-box">Initialisation...</div>
    </div>

    <script>
        const themes = [
            {n:"GRINEER",c:"#d4af37"},
            {n:"CORPUS",c:"#00d4ff"},
            {n:"INFESTÉ",c:"#00ff88"},
            {n:"STALKER",c:"#ff0000"},
            {n:"OROKIN",c:"#e8d080"}
        ];
        let themeIdx = 0, currentFilter = 'cycles', currentSubFilter = 'general', lastJson = null, intervals = [];

        function applyCustomColor(hex) { 
            document.documentElement.style.setProperty('--accent', hex); 
            document.documentElement.style.setProperty('--glow', hex+'66');
            document.getElementById('visualPicker').style.backgroundColor = hex;
            localStorage.setItem('wf_grineer_save', hex); 
        }

        function cycleTheme() { 
            themeIdx = (themeIdx + 1) % themes.length; 
            applyCustomColor(themes[themeIdx].c);
            document.getElementById('themeBtn').innerText = "THEME: " + themes[themeIdx].n;
        }

        function setFilter(f) { currentFilter = f; document.getElementById('view-title').innerText = f.toUpperCase(); render(); }
        function setSubFilter(sf) { currentSubFilter = sf; render(); }

        function startTicker(id, expiry) {
            const el = document.getElementById(id); if(!el || !expiry) return;
            const up = () => {
                const diff = new Date(expiry).getTime() - new Date().getTime();
                if(diff <= 0) { el.innerHTML = "00m 00s"; return; }
                const h=Math.floor(diff/3600000), m=Math.floor((diff%3600000)/60000), s=Math.floor((diff%60000)/1000);
                el.innerHTML = (h > 0 ? h + 'h ' : '') + (m < 10 ? '0' + m : m) + 'm ' + (s < 10 ? '0' + s : s) + 's';
            };
            up(); intervals.push(setInterval(up, 1000));
        }

        function render() {
            if(!lastJson) return;
            intervals.forEach(clearInterval); intervals = [];
            let html = "", box = document.getElementById('main-box');
            
            

            if(currentFilter === 'cycles') {
    // 1. Petit traducteur et dictionnaire de couleurs pour Duviri
    const duviriData = {
        "joy": {n: "JOIE", c: "#00ff88"},     // Vert
        "anger": {n: "COLÈRE", c: "#ff4444"},  // Rouge
        "envy": {n: "ENVIE", c: "#d4af37"},    // Doré
        "sorrow": {n: "TRISTESSE", c: "#00d4ff"}, // Bleu
        "fear": {n: "PEUR", c: "#8844ff"}      // Violet
    };

    const dState = (lastJson.duviriCycle?.state || "N/A").toLowerCase();
    const dInfo = duviriData[dState] || {n: dState.toUpperCase(), c: "var(--accent)"};

    // 2. Configuration des cycles avec leurs couleurs
    const c = [
        {l:"CETUS", s:lastJson.cetusCycle?.isDay?"JOUR":"NUIT", e:lastJson.cetusCycle?.expiry, color: lastJson.cetusCycle?.isDay?"#ffcc00":"#4466ff"},
        {l:"VALLIS", s:lastJson.vallisCycle?.isWarm?"CHAUD":"FROID", e:lastJson.vallisCycle?.expiry, color: lastJson.vallisCycle?.isWarm?"#ff6600":"#00d4ff"},
        {l:"DEIMOS", s:(lastJson.cambionCycle?.active||"VOME").toUpperCase(), e:lastJson.cambionCycle?.expiry, color: (lastJson.cambionCycle?.active==="vome")?"#00d4ff":"#ff4444"},
        {l:"DUVIRI", s:dInfo.n, e:lastJson.duviriCycle?.expiry, color: dInfo.c},
        {l:"ZARIMAN", s:(lastJson.zarimanCycle?.state||"N/A").toUpperCase(), e:lastJson.zarimanCycle?.expiry, color: "#e8d080"}
    ];

    c.forEach((item, i) => {
        html += `
            <div class="row" style="border-left: 3px solid ${item.color}; padding-left: 15px; margin-bottom: 5px; background: rgba(255,255,255,0.02);">
                <span style="font-family:'Orbitron'; font-size:0.8em;">${item.l}</span>
                <span class="status" style="color:${item.color}; text-shadow: 0 0 10px ${item.color}66;">${item.s}</span>
                <span class="timer" id="t${i}"></span>
            </div>`;
    });
    
    box.innerHTML = html;
    c.forEach((item, i) => startTicker('t'+i, item.e));
}


else if(currentFilter === 'alerts') {
    html = `<div class="sub-nav">
        <button class="sub-btn ${currentSubFilter==='general'?'active':''}" onclick="setSubFilter('general')">ALERTE</button>
        <button class="sub-btn ${currentSubFilter==='sortie'?'active':''}" onclick="setSubFilter('sortie')">SORTIE</button>
        <button class="sub-btn ${currentSubFilter==='invasion'?'active':''}" onclick="setSubFilter('invasion')">INVASION</button>
        <button class="sub-btn ${currentSubFilter==='baro'?'active':''}" onclick="setSubFilter('baro')">BARO</button>
        <button class="sub-btn ${currentSubFilter==='nightwave'?'active':''}" onclick="setSubFilter('nightwave')">NIGHTWAVE</button>
        <button class="sub-btn ${currentSubFilter==='resurgence'?'active':''}" onclick="setSubFilter('resurgence')">RÉSURGENCE VARZIA</button>



    </div>`;
    let inner = "";
    
    if(currentSubFilter === 'general') {
        (lastJson.alerts || []).forEach((al, i) => {
            const items = al.mission.reward.items.join(', ');
            const credits = al.mission.reward.credits;
            const cadeauComplet = `${items} + ${credits}cr`;

            inner += `<div class="row" style="flex-direction:column; align-items:flex-start; border-bottom:1px solid rgba(255,255,255,0.05); padding: 12px 0;">
                <div style="display:flex; width:100%; justify-content:space-between;">
                    <span class="status" style="color:white; font-size:0.9em;">${al.mission.type}</span>
                    <span class="timer" id="al${i}"></span>
                </div>
                <div style="color:var(--accent); font-family:'Orbitron'; font-size:0.8em; margin: 4px 0; font-weight:bold;">
                    🎁 RECOMPENSE : ${cadeauComplet}
                </div>
                <div class="node-info" style="color:#aaa;">
                    ${al.mission.node} | Level ${al.mission.minEnemyLevel}-${al.mission.maxEnemyLevel}
                </div>
            </div>`;
            startTicker('al'+i, al.expiry);
        });
    }
    else if(currentSubFilter === 'sortie' && lastJson.sortie) {
        inner += `<div class="status" style="color:#ff4444; margin-bottom:5px;">BOSS: ${lastJson.sortie.boss}</div>`;
        lastJson.sortie.variants.forEach(v => {
            inner += `<div class="row" style="flex-direction:column; align-items:flex-start;"><span class="status" style="color:var(--accent)">${v.missionType}</span><div class="node-info">${v.node} | ${v.modifier}</div></div>`;
        });
        inner += `<div style="text-align:center; margin-top:10px;"><span class="timer" id="stie"></span></div>`;
        startTicker('stie', lastJson.sortie.expiry);
    }
    else if(currentSubFilter === 'invasion' && lastJson.invasions) {
        lastJson.invasions.forEach((inv, i) => {
            if(!inv.completed) {
                let rewardAtt = "Crédits";
                let rewardDef = "Crédits";

                if (inv.attacker && inv.attacker.reward && inv.attacker.reward.countedItems && inv.attacker.reward.countedItems.length > 0) {
                    const item = inv.attacker.reward.countedItems[0];
                    rewardAtt = `${item.count}x ${item.type}`;
                }

                if (inv.defender && inv.defender.reward && inv.defender.reward.countedItems && inv.defender.reward.countedItems.length > 0) {
                    const item = inv.defender.reward.countedItems[0];
                    rewardDef = `${item.count}x ${item.type}`;
                }
                
                const percent = Math.round(inv.completion || 0);

                inner += `
                    <div class="row" style="flex-direction:column; align-items:flex-start; border-bottom:1px solid rgba(255,255,255,0.1); padding: 12px 0;">
                        <div style="font-weight:bold; font-size:0.85em; color:white; margin-bottom:8px;">
                            ${inv.node} • <span style="color:#aaa; font-weight:normal;">${inv.desc}</span>
                        </div>
                        
                        <div style="display:flex; width:100%; justify-content:space-between; gap:10px; margin-bottom:10px;">
                            <div style="flex:1; border-left:3px solid #ff4444; padding-left:8px;">
                                <div style="font-size:0.65em; color:#ff4444; font-weight:bold; text-transform:uppercase;">${inv.attacker.faction}</div>
                                <div style="font-size:0.75em; color:#eee;">${rewardAtt}</div>
                            </div>

                            <div style="flex:1; border-right:3px solid #0088ff; padding-right:8px; text-align:right;">
                                <div style="font-size:0.65em; color:#0088ff; font-weight:bold; text-transform:uppercase;">${inv.defender.faction}</div>
                                <div style="font-size:0.75em; color:#eee;">${rewardDef}</div>
                            </div>
                        </div>

                        <div style="width:100%; height:16px; background:#111; border-radius:8px; position:relative; overflow:hidden; border:1px solid #333;">
                            <div style="width:${percent}%; height:100%; background:linear-gradient(90deg, #ff4444, #0088ff); transition: width 0.3s;"></div>
                            <div style="position:absolute; width:100%; top:0; left:0; text-align:center; font-size:0.7em; line-height:16px; color:white; font-weight:bold; text-shadow: 1px 1px 2px black;">
                                ${percent}%
                            </div>
                        </div>
                    </div>`;
            }
        });
    }
    
    if (currentSubFilter === 'resurgence') {
    const vaultData = lastJson.vaultTrader;
    
    if (vaultData && vaultData.inventory) {
        const inventory = vaultData.inventory;

        html += `
            <div style="padding: 20px 15px; text-align: center; border-bottom: 2px solid var(--accent); margin-bottom: 20px; background: linear-gradient(to bottom, var(--glow), transparent);">
                <h2 style="font-family:'Orbitron'; color: var(--accent); margin:0; letter-spacing:4px; text-shadow: 0 0 15px var(--accent), 0 0 30px var(--glow); font-size: 1.4em;">RÉSURGENCE PRIME</h2>
                <div style="color: #fff; font-size:0.75em; margin-top:8px; font-family:'Orbitron'; opacity: 0.8; letter-spacing: 2px;">BAZAR DE MAROO • MARS</div>
            </div>

            <div style="display: flex; flex-direction: column; align-items: center; padding: 10px;">
                <div style="background: rgba(0,0,0,0.6); border: 2px solid var(--accent); border-radius: 15px; padding: 25px; width: 90%; text-align: center; margin-bottom: 25px; box-shadow: 0 0 20px var(--glow), inset 0 0 15px var(--glow);">
                    <div style="color: #eee; font-size: 0.7em; margin-bottom: 10px; font-family:'Orbitron'; letter-spacing: 2px; opacity: 0.9;">FIN DE LA ROTATION DANS</div>
                    <div id="vz_timer" style="font-family:'Orbitron'; font-size: 2em; color: var(--accent); font-weight: bold; text-shadow: 0 0 10px var(--accent);">--D --H --M --S</div>
                </div>

                <div style="width: 100%; padding: 0 5px;">`;

        // Filtrage des Warframes et cosmétiques Prime
        let primesAAfficher = new Set();
        inventory.forEach(entry => {
            let brut = entry.item || "";
            // On cible les Packs et les Suits comme sur ton screen
            if (brut.includes("Prime") && (brut.includes("Pack") || brut.includes("Suit") || brut.includes("Bobble"))) {
                let nom = brut
                    .replace("M P V ", "")
                    .replace("Dual Pack", "")
                    .replace("Single Pack", "")
                    .replace("Prime", "")
                    .replace("Bobble Head", "FIGURINE")
                    .trim();
                
                if (nom !== "") {
                    primesAAfficher.add(nom.toUpperCase());
                }
            }
        });

        // Affichage avec style "Orbiteur"
        primesAAfficher.forEach(nom => {
            html += `
                <div class="row" style="background: linear-gradient(90deg, var(--glow) 0%, rgba(0,0,0,0.3) 100%); border-left: 6px solid var(--accent); margin-bottom:12px; padding:18px; border-radius: 4px; box-shadow: 0 4px 15px rgba(0,0,0,0.5);">
                    <div style="display: flex; align-items: center; gap: 15px;">

 function startTicker(id, expiry) {
    const el = document.getElementById(id);
    if(!el || !expiry) return;

    function update() {
        // Correction du calcul de temps pour être compatible tout support
        const diff = new Date(expiry).getTime() - new Date().getTime();
        
        if(diff <= 0) {
            el.innerHTML = "EXPIRÉ";
            return;
        }
        
        const d = Math.floor(diff / 86400000);
        const h = Math.floor((diff % 86400000) / 3600000);
        const m = Math.floor((diff % 3600000) / 60000);
        const s = Math.floor((diff % 60000) / 1000);
        
        // AFFICHAGE DYNAMIQUE
        if (d > 0) {
            // Si c'est long (Archonte/Varzia) : 6J 12H 30M
            el.innerHTML = `${d}J ${h}H ${m}M ${s}S`;
        } else {
            // Si c'est court (Cetus/Fissures) : 45M 12S
            el.innerHTML = `${h > 0 ? h + 'H ' : ''}${m}M ${s}S`;
        }
    }
    
    update();
    const interval = setInterval(() => {
        if(!document.getElementById(id)) {
            clearInterval(interval);
            return;
        }
        update();
    }, 1000);
}

function getWikiImage(name, isSteel) {
    // Nettoyage : "Soma Incarnon Genesis" -> "SomaIncarnonGenesis"
    let cleanName = name.replace(/&/g, '').replace(/\s+/g, '');

    if (isSteel) {
        // ON ENLÈVE "Assets/" car le HTML est déjà dedans !
        // Le code va chercher directement le dossier "icon" qui est à côté du HTML
        return `icon/icon_incarnon/${cleanName}.png`;
    } else {
        // Pour les Warframes, le Wiki fonctionne toujours car c'est un lien internet
        let frameName = cleanName.replace('IncarnonGenesis', '');
        return `https://wiki.warframe.com/w/Special:Redirect/file/${frameName}Icon272.png`;
    }
}
